version: '3.8'

services:
  family-tree-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-tree-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-admin123}
    volumes:
      # Persistent volume agar database SQLite dan gambar upload tidak hilang
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
